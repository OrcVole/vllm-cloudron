# Immediate-health reverse proxy in front of vLLM.
#
# vLLM binds its HTTP port only after model load and engine warmup, which on first boot
# includes downloading the model. During that window /health would be connection-refused and
# Cloudron would restart-loop the container (ADR 0003). nginx listens on the manifest
# httpPort (8000) from the first second, answers /health 200 immediately, serves the landing
# page at /, exposes /ready as a passthrough readiness probe, and proxies everything else to
# vLLM on 127.0.0.1:8001 with buffering off so streamed completions flow token by token.
#
# vLLM runs as the container's main process (PID 1 via exec gosu in start.sh); if it exits the
# container exits. The static /health therefore only bridges warmup and cannot mask a crash.
#
# All writable paths are under /run (tmpfs): the root filesystem is read-only at runtime.

worker_processes 1;
daemon off;
pid /run/nginx/nginx.pid;
# The "stderr" keyword, NOT the "/dev/stderr" path: as the unprivileged user, opening the
# /dev/stderr path fails EACCES and nginx silently never binds.
error_log stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  client_body_temp_path /run/nginx/body;
  proxy_temp_path       /run/nginx/proxy;
  fastcgi_temp_path     /run/nginx/fastcgi;
  uwsgi_temp_path       /run/nginx/uwsgi;
  scgi_temp_path        /run/nginx/scgi;

  # Chat payloads with long context can be sizeable.
  client_max_body_size 16m;

  server {
    listen 8000;
    server_name _;

    # Platform liveness: always answers, even while the model is still downloading.
    location = /health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Readiness passthrough: 200 only once vLLM has loaded the model and bound its port.
    # Returns 502 during warmup, which is exactly what a readiness probe should see.
    location = /ready {
      proxy_pass http://127.0.0.1:8001/health;
      proxy_connect_timeout 2s;
      proxy_read_timeout 5s;
    }

    # The bare domain serves a small landing page instead of a blank screen (an API-only app
    # that shows nothing at / reads as broken). default_type because mime.types is not
    # included and the page must arrive as HTML.
    location = / {
      root /app/code/www;
      default_type text/html;
      try_files /index.html =404;
    }

    # Everything else is vLLM's OpenAI API. Buffering off so server-sent token streams are
    # delivered as they are produced; generous read timeout for slow CPU token gaps.
    location / {
      proxy_pass http://127.0.0.1:8001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }
  }
}
